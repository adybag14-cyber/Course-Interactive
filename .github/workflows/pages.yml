name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static course
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check required files
        run: |
          test -f index.html
          test -f cs_algorithms_interactive_course_500_pages.html
          test -f cs_algorithms_interactive_course_500_pages.ipynb
          test -f assets/interactive-preview.gif
          grep -q "CS Algorithms Interactive Course" cs_algorithms_interactive_course_500_pages.html
          grep -q "561 Pages" cs_algorithms_interactive_course_500_pages.html
          grep -q "manual-curation-final" cs_algorithms_interactive_course_500_pages.html
          grep -q "practice-studio" cs_algorithms_interactive_course_500_pages.html
          grep -q "final-diagram-pass" cs_algorithms_interactive_course_500_pages.html
          grep -q "final-anchor-pass" cs_algorithms_interactive_course_500_pages.html

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        run: |
          rm -rf site
          mkdir -p site/assets
          cp index.html site/
          cp .nojekyll site/
          cp README.md site/
          cp cs_algorithms_interactive_course_500_pages.html site/
          cp cs_algorithms_interactive_course_500_pages.ipynb site/
          cp assets/interactive-preview.gif site/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v5
